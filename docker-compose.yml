services:
  db:
    image: postgres:16-alpine
    container_name: findit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-findit_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-POSTGRES1}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - findit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  findit_postgres_data:
